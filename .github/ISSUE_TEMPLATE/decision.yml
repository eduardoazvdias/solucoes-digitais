name: Decisao pendente
description: Registrar uma escolha que pode exigir um ADR
title: "[Decisao] "
labels: ["decisao"]
body:
  - type: textarea
    id: question
    attributes:
      label: Decisao necessaria
      description: Qual pergunta precisa ser respondida?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Alternativas
      description: Quais opcoes foram consideradas?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencias e premissas
      description: O que sabemos e o que ainda e hipotese?
    validations:
      required: true
  - type: input
    id: review
    attributes:
      label: Condicao de revisao
      description: Quando esta decisao deve ser reavaliada?
